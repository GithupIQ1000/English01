<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vocabulary Offline</title>
</head>
<body>
<style>
  /* Container bo tròn, căn giữa */
  .debug-container {
      padding: 10px;
      font-size: 18px;
  }

  /* Ô tìm kiếm */
  .search-box {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 8px;
  }

  /* Nút lớn */
  .big-btn {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
  }

  /* Bảng responsive */
  .table-wrapper {
      overflow-x: auto;
  }

  table {
      width: 100%;
      border-collapse: collapse;
      font-size: 17px;
  }

  th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
  }

  th {
      background: #f3f3f3;
  }

  .pagination {
      margin: 12px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
  }
  .pagination button {
      padding: 6px 12px;
      font-size: 15px;
      cursor: pointer;
  }
  .pagination button.active {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
  }
</style>

<h3>Upload JSON dữ liệu từ MySQL</h3>
<input type="file" id="jsonFile" accept=".json">
<button onclick="importJSON()">Nhập dữ liệu</button>
<button onclick="exportJSON()">📦 Xuất file JSON</button>
<button onclick="debugShowAllWords()">Show dữ liệu</button>
<button onclick="debugHideAllWords()">Hide dữ liệu</button>

<div id="import-result" style="margin-top:10px;color:green;font-weight:bold"></div>

<hr>

<!-- HỌC TỪ -->
<div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
    <div id="word"></div>
    <div id="answer"></div>

    <div style="display:flex; gap:10px;">
        <button class="learn" onclick="nextWord()">Next</button>
        <button class="learn" onclick="backWord()">Back</button>
    </div>
    
    <button id="btnFinish" onclick="finish()">Finish</button>
    <button id="btnStart" onclick="start()" style="display:none;">Start</button>
</div>

<hr>

<div id="debug-output" style="white-space:pre-wrap;"></div>


<script>
/* ============================================================
   KHỞI TẠO INDEXEDDB
============================================================ */
let db;

const request = indexedDB.open("MyDB", 1);

request.onupgradeneeded = function (e) {
    const database = e.target.result;

    if (!database.objectStoreNames.contains("words")) {
        const store = database.createObjectStore("words", { keyPath: "key" });

        store.createIndex("word", "word");
        store.createIndex("type", "type");
        store.createIndex("mean", "mean");
        store.createIndex("next_reading_time", "next_reading_time");
    }
};

request.onsuccess = function (e) {
    db = e.target.result;
    console.log("IndexedDB Ready");

    takeVocabulary();
};

request.onerror = function () {
    alert("Lỗi mở IndexedDB");
};


/* ============================================================
   HÀM LẤY NGÀY (YYYY-MM-DD)
============================================================ */
function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}


/* ============================================================
   IMPORT JSON
   - Hỗ trợ 2 cấu trúc: MySQL dump và export của app
============================================================ */
function importJSON() {
    const file = document.getElementById("jsonFile").files[0];
    if (!file) return alert("Chọn file trước!");

    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);

            // --- Cấu trúc 1: MySQL dump ---
            let rawWords = null;
            if (Array.isArray(data)) {
                const tableObj = data.find(item => item.type === "table" && item.name === "words");
                if (tableObj && Array.isArray(tableObj.data)) {
                    rawWords = tableObj.data;
                }
            }

            // --- Cấu trúc 2: export của app (mảng object có trường word/type/mean) ---
            if (!rawWords) {
                if (Array.isArray(data) && data.length > 0 && data[0].word && data[0].type && data[0].mean) {
                    rawWords = data;
                }
            }

            if (!rawWords) return alert("Không tìm thấy bảng words!");

            saveWords(rawWords);
        } catch { alert("JSON lỗi!"); }
    };
    reader.readAsText(file);
}


/* ============================================================
   SAVE WORDS — backup → confirm → xóa → insert
   - Lọc host="Long" nếu có, giữ tất cả nếu không có host
   - Task 1: gán mặc định next_reading_time, created_date, correct_count, wrong_count
============================================================ */
function saveWords(rawWords) {
    exportJSON(); // backup trước khi xóa

    const todayStr = today();
    const incoming = {};

    rawWords.forEach(w => {
        if (w.host && w.host !== "Long") return; // bỏ qua host khác nếu có
        const key = `${w.word}|${w.type}|${w.mean}`;
        incoming[key] = {
            key,
            word:              w.word,
            type:              w.type,
            mean:              w.mean,
            sum_point_reading: Number(w.sum_point_reading || 0),
            next_reading_time: w.next_reading_time || todayStr,
            created_date:      w.created_date      || todayStr,
            correct_count:     Number(w.correct_count  || 0),
            wrong_count:       Number(w.wrong_count    || 0)
        };
    });

    const keys = Object.keys(incoming);
    if (!keys.length) return alert("Không có từ nào hợp lệ trong file!");

    // Hỏi xác nhận trước khi xóa dữ liệu cũ
    if (!confirm(`Xóa toàn bộ dữ liệu cũ và nhập ${keys.length} từ mới?\n(Đã tự động backup trước khi xóa)`)) return;

    const clearTx = db.transaction("words", "readwrite");
    clearTx.objectStore("words").clear();
    clearTx.oncomplete = () => {
        // Xóa xong mới insert — transaction mới hoàn toàn
        insertAllWords(keys, incoming);
    };
    clearTx.onerror = e => {
        console.error("Clear error:", e.target.error);
        alert("Lỗi khi xóa dữ liệu cũ!");
    };
}


/* ============================================================
   INSERT ALL WORDS — xử lý tuần tự, mỗi từ 1 transaction riêng
   Lỗi 1 từ không ảnh hưởng các từ còn lại
============================================================ */
function insertAllWords(keys, incoming) {
    let countOk = 0;
    let countError = 0;

    function processOne(index) {
        if (index >= keys.length) {
            document.getElementById("import-result").innerText =
                `Nhập thành công ${countOk} từ, lỗi ${countError} từ.`;
            takeVocabulary();
            return;
        }

        const key = keys[index];
        const item = incoming[key];

        const tx = db.transaction("words", "readwrite");
        tx.objectStore("words").put(item);

        tx.oncomplete = function () {
            countOk++;
            processOne(index + 1);
        };

        tx.onerror = function (e) {
            console.error(`Lỗi khi insert [${key}]:`, e.target.error);
            countError++;
            processOne(index + 1);
        };
    }

    processOne(0);
}


/* ============================================================
   XUẤT DỮ LIỆU TỪ INDEXEDDB RA FILE JSON
============================================================ */
function exportJSON() {
    const tx = db.transaction("words", "readonly");
    const store = tx.objectStore("words");

    const req = store.getAll();

    req.onsuccess = function (e) {
        const all = e.target.result;

        if (!all || all.length === 0) {
            alert("Không có dữ liệu để xuất!");
            return;
        }

        const exportData = all.map(w => ({
            word:              w.word,
            type:              w.type,
            mean:              w.mean,
            sum_point_reading: w.sum_point_reading,
            next_reading_time: w.next_reading_time,
            created_date:      w.created_date,
            correct_count:     w.correct_count,
            wrong_count:       w.wrong_count
        }));

        const json = JSON.stringify(exportData, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `words_${new Date().toISOString().slice(0,10)}.json`;
        a.click();

        URL.revokeObjectURL(url);
    };

    req.onerror = function () {
        alert("Lỗi khi xuất dữ liệu!");
    };
}


/* ============================================================
   LOAD WORD HÔM NAY
============================================================ */
let words = [];
let count = -1;
let end_count = 0;

function takeVocabulary() {
    document.querySelectorAll(".learn").forEach(btn => btn.style.display = "inline-block");
  
    const tx = db.transaction("words", "readonly");
    const store = tx.objectStore("words");

    store.getAll().onsuccess = function (e) {
        const all = e.target.result;
        const todayDate = today();
                
        words = all.filter(w => todayDate >= w.next_reading_time);
        words.sort((a, b) => a.sum_point_reading - b.sum_point_reading);      
        
        // reset toàn bộ thuộc tính
        let n = 0;
        words.forEach(w => {
            w.Nx_points = 0;
            w.status = -1;
            n++;
        });
        document.getElementById("debug-output").innerHTML = n;
        
        end_count = words.length;
        count = -1;

        if (words.length === 0) {
            document.getElementById("word").innerHTML = "Hôm nay không có bài.";
            document.querySelectorAll(".learn").forEach(btn => btn.style.display = "none");
            return;
        }

        nextWord();
    };
}


/* ============================================================
   HỌC TỪ — NEXT / BACK
============================================================ */
function nextWord() {

    count++;  // FIXED — không nhảy 200 dòng nữa

    if (count >= end_count) {
        count = end_count;

        document.getElementById("word").innerHTML = "Hoàn thành!";

        document.getElementById("answer").innerHTML =
          "<button onclick=\"saveVocabulary()\">Finish</button>";

        return;
    }

    if (words[count].status === undefined) words[count].status = -1;

    showWord();
}

function backWord() {
    count--;
    if (count < 0) count = 0;
    showWord();
}


/* ============================================================
   HIỂN THỊ 1 TỪ
============================================================ */
function showWord() {
    const w = words[count];

    let color = "black";
    if (w.status === 1) color = "green";
    if (w.status === 0) color = "red";

    document.getElementById("word").innerHTML = `
        <div id="sentence" style="font-size:35px;color:${color};">
            ${w.word}
        </div>
        <button onclick="answer()">Answer</button>
    `;

    if (w.status === -1) {
        words[count].Nx_points = 0;
        document.getElementById("answer").innerHTML =
            `<button onclick="markNx()">x N_point</button>`;
    } else {
        showFullCard();
    }
}


/* ============================================================
   SHOW TYPE → SHOW FULL
============================================================ */
function answer() {
    const w = words[count];

    const short = `<div>(${w.type})</div>`;
    const box = document.getElementById("answer");

    if (box.innerHTML === "" || box.innerHTML.includes("x N_point")) {
        box.innerHTML = short;
        return;
    }

    if (box.innerHTML.trim() === short.trim()) {
        showFullCard();
        return;
    }

    box.innerHTML = "";
}


/* ============================================================
   SHOW FULL CARD
============================================================ */
function showFullCard() {
    const w = words[count];

    document.getElementById("answer").innerHTML = `
        <div>${w.word}</div>
        <div>${w.word} (${w.type}): ${w.mean}</div>
        <button onclick="mark(1)">Ok</button>
        <button onclick="mark(0)">Forget</button>
    `;
}


/* ============================================================
   MARK
============================================================ */
function markNx() {
    words[count].Nx_points = 1;
    document.getElementById("answer").innerHTML = "";
}

function mark(status) {
    words[count].status = status;

    const s = document.getElementById("sentence");
    if (status === 1) s.style.color = "green";
    if (status === 0) s.style.color = "red";

    if (status === 1) nextWord();
}

function start() {

    // Ẩn nút Start
    document.getElementById("btnStart").style.display = "none";

    // Hiện nút Finish
    document.getElementById("btnFinish").style.display = "inline-block";

    // Xóa phần tổng kết
    const finishBox = document.getElementById("finish");
    finishBox.innerHTML = "";
    finishBox.style.display = "none";

    // Load lại danh sách để học
    takeVocabulary();
}

function finish() {
    document.getElementById("btnStart").style.display = "inline-block";
    document.getElementById("btnFinish").style.display = "none";
    saveVocabulary();
}


/* ============================================================
   LƯU KẾT QUẢ HỌC
   Task 2: cộng correct_count khi đúng, wrong_count khi sai
============================================================ */
function saveVocabulary() {
    if (!words || words.length === 0) {
        alert("Không có dữ liệu để lưu.");
        return;
    }

    const summaryBox = document.createElement("div");
    summaryBox.id = "finish";
    summaryBox.style = `
        font-size: 22px;
        max-height: 80vh;
        overflow-y: auto;
        padding: 10px;
        margin-top: 20px;
        border: 1px solid #ccc;
    `;
    summaryBox.innerHTML = `<b>Bạn đã hoàn thành readings hôm nay:</b><br><br>`;

    const tx = db.transaction("words", "readwrite");
    const store = tx.objectStore("words");

    const todayDate = today();

    words.forEach(w => {

        // chỉ xử lý các từ được đánh giá
        if (w.status !== 0 && w.status !== 1) return;

        let point = Number(w.sum_point_reading);
        let Nx = 1.5;
        let newDate = new Date(todayDate);

        if (w.status === 1) {
            // đúng → tăng điểm
            let bonus = 1.3 + Math.round(point / 5.9 * 100) / 100;
            point += bonus;

            if (w.Nx_points) {
                if (point < 45) {
                    point = Math.round(point * Nx * 100) / 100;
                } else {
                    point += Math.round((point / 6) * Nx * 100) / 100;
                }
            }

            newDate.setDate(newDate.getDate() + Math.floor(point));

        } else if (w.status === 0) {
            // sai → giảm điểm
            point = Math.round(point * 2 / 3 * 100) / 100;

            if (w.Nx_points) point = Math.round(point / Nx * 100) / 100;

            newDate.setDate(newDate.getDate() + Math.floor(point / 2));
        }

        // Task 2: cộng đúng/sai
        const newCorrect = (Number(w.correct_count) || 0) + (w.status === 1 ? 1 : 0);
        const newWrong   = (Number(w.wrong_count)   || 0) + (w.status === 0 ? 1 : 0);

        // cập nhật vào IndexedDB
        const updated = {
            ...w,
            sum_point_reading: point,
            next_reading_time: newDate.toISOString().slice(0, 10),
            correct_count:     newCorrect,
            wrong_count:       newWrong
        };

        store.put(updated);

        // đưa vào bảng kết quả
        const color = (w.status === 1 ? "green" : "red");
        summaryBox.innerHTML += `
            <div style="margin-bottom:5px; color:${color}">
                ${w.word} (${w.type}): ${w.mean}
            </div>
        `;
    });

    tx.oncomplete = function () {

        // ẩn nút next/back
        document.querySelectorAll(".learn").forEach(btn => btn.style.display = "none");

        // xoá khung học
        document.getElementById("word").innerHTML = "";
        document.getElementById("answer").innerHTML = "";

        // hiển thị bảng tổng kết
        document.body.appendChild(summaryBox);
    };
}


/* ============================================================
   DEBUG — SHOW ALL WORDS
   Task 3: thêm cột correct_count, wrong_count, created_date (chỉ đọc)
           phân trang 100 từ/trang
           khi edit có horizontal scroll
============================================================ */
let _debugAllWords = [];
let _debugPage = 1;
const PAGE_SIZE = 100;

function debugShowAllWords(page) {
    const tx = db.transaction("words", "readonly");
    const store = tx.objectStore("words");

    store.getAll().onsuccess = function (e) {
        _debugAllWords = e.target.result;
        _debugPage = page || 1;
        renderDebugTable();
    };
}

function renderDebugTable() {
    const list = _debugAllWords;
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (_debugPage < 1) _debugPage = 1;
    if (_debugPage > totalPages) _debugPage = totalPages;

    const start = (_debugPage - 1) * PAGE_SIZE;
    const pageData = list.slice(start, start + PAGE_SIZE);

    let html = `
        <button onclick="showCreateForm()" style="margin-bottom:10px;">+ Tạo mới</button>
        <div style="margin-bottom:10px;">
            <input id="searchWord" placeholder="Tìm theo word" oninput="filterDebugTable()" />
            <input id="searchMean" placeholder="Tìm theo mean" oninput="filterDebugTable()" />
        </div>
        <div class="pagination" id="pagination-top">
            ${buildPagination(totalPages)}
        </div>
        <div style="overflow-x:auto;">
        <table id="debug-table" border=1 cellpadding=5 style="border-collapse:collapse; min-width:900px;">
            <tr style="background:#eee;">
                <th>Word</th>
                <th>Type</th>
                <th>Mean</th>
                <th>Reading</th>
                <th>Next Read</th>
                <th>✅ Đúng</th>
                <th>❌ Sai</th>
                <th>Ngày tạo</th>
                <th>Action</th>
            </tr>
    `;

    pageData.forEach(w => {
        html += `
            <tr id="row-${w.key}" class="data-row"
                data-word="${w.word}"
                data-mean="${w.mean}">
                <td>${w.word}</td>
                <td>${w.type}</td>
                <td>${w.mean}</td>
                <td>${w.sum_point_reading}</td>
                <td>${w.next_reading_time}</td>
                <td style="text-align:center;">${w.correct_count ?? 0}</td>
                <td style="text-align:center;">${w.wrong_count ?? 0}</td>
                <td>${w.created_date || ''}</td>
                <td>
                    <button onclick="editWord('${w.key}')">Sửa</button>
                    <button onclick="deleteWord('${w.key}')">Xóa</button>
                </td>
            </tr>
        `;
    });

    html += `</table></div>
        <div class="pagination" id="pagination-bottom">
            ${buildPagination(totalPages)}
        </div>
    `;

    document.getElementById("debug-output").innerHTML = html;
}

function buildPagination(totalPages) {
    let html = '';
    for (let i = 1; i <= totalPages; i++) {
        const active = (i === _debugPage) ? 'class="active"' : '';
        html += `<button ${active} onclick="goPage(${i})">${i}</button>`;
    }
    return html;
}

function goPage(page) {
    _debugPage = page;
    renderDebugTable();
}

function filterDebugTable() {
    let word = document.getElementById("searchWord").value.toLowerCase();
    let mean = document.getElementById("searchMean").value.toLowerCase();

    document.querySelectorAll("#debug-table tr.data-row").forEach(tr => {
        let w = tr.getAttribute("data-word").toLowerCase();
        let m = tr.getAttribute("data-mean").toLowerCase();

        tr.style.display =
            (w.includes(word) && m.includes(mean)) ? "" : "none";
    });
}

function debugHideAllWords(){
    document.getElementById("debug-output").innerHTML = "";
}

function showCreateForm() {
    const form = `
        <div id="edit-box" style="padding:10px; border:1px solid #000; margin:10px 0;">
            <b>Tạo mới từ</b><br><br>
            Word: <input id="e_word"><br>
            Type: <input id="e_type"><br>
            Mean: <input id="e_mean"><br><br>
            <button onclick="saveNewWord()">Lưu</button>
            <button onclick="debugShowAllWords()">Hủy</button>
        </div>
    `;

    document.getElementById("debug-output").insertAdjacentHTML("afterbegin", form);
}

function saveNewWord() {
    const word = document.getElementById("e_word").value.trim();
    const type = document.getElementById("e_type").value.trim();
    const mean = document.getElementById("e_mean").value.trim();

    if (!word || !type || !mean) return alert("Thiếu dữ liệu!");

    const key = `${word}|${type}|${mean}`;
    const todayDate = today();

    const item = {
        key,
        word,
        type,
        mean,
        sum_point_reading:  0,
        sum_point_speaking: 0,
        next_reading_time:  todayDate,
        next_speaking_time: todayDate,
        created_date:       todayDate,
        correct_count:      0,
        wrong_count:        0
    };

    const tx = db.transaction("words", "readwrite");
    tx.objectStore("words").add(item);

    tx.oncomplete = () => {
        alert("Đã tạo từ!");
        takeVocabulary();
        debugShowAllWords();
    };
}


function editWord(key) {
    const tx = db.transaction("words", "readonly");
    const store = tx.objectStore("words");

    store.get(key).onsuccess = function (e) {
        const w = e.target.result;

        const row = document.getElementById(`row-${key}`);

        row.innerHTML = `
            <td style="min-width:120px;"><div style="overflow-x:auto;"><input name="e_word_${key}" value="${w.word}" style="min-width:100px;"></div></td>
            <td><input name="e_type_${key}" value="${w.type}" style="width:70px;"></td>
            <td style="min-width:180px;"><div style="overflow-x:auto;"><input name="e_mean_${key}" value="${w.mean}" style="min-width:160px;"></div></td>
            <td><input name="e_read_${key}" value="${w.sum_point_reading}" style="width:70px;"></td>
            <td><input name="e_next_${key}" value="${w.next_reading_time}" style="width:110px;"></td>
            <td style="text-align:center;color:#888;">${w.correct_count ?? 0}</td>
            <td style="text-align:center;color:#888;">${w.wrong_count ?? 0}</td>
            <td style="color:#888;">${w.created_date || ''}</td>
            <td>
                <button onclick="saveEdit('${key}')">Lưu</button>
                <button onclick="debugShowAllWords()">Hủy</button>
            </td>
        `;
    };
}


function saveEdit(oldKey) {

    const word = document.querySelector(`input[name="e_word_${oldKey}"]`).value.trim();
    const type = document.querySelector(`input[name="e_type_${oldKey}"]`).value.trim();
    const mean = document.querySelector(`input[name="e_mean_${oldKey}"]`).value.trim();
    const read = Number(document.querySelector(`input[name="e_read_${oldKey}"]`).value);
    const next = document.querySelector(`input[name="e_next_${oldKey}"]`).value.trim();

    if (!word || !type || !mean) {
        alert("Thiếu dữ liệu!"); 
        return;
    }

    if (!next.match(/^\d{4}-\d{2}-\d{2}$/)) {
        alert("Ngày phải theo định dạng YYYY-MM-DD");
        return;
    }

    const newKey = `${word}|${type}|${mean}`;

    // Lấy dữ liệu cũ để giữ lại correct_count, wrong_count, created_date
    const txRead = db.transaction("words", "readonly");
    txRead.objectStore("words").get(oldKey).onsuccess = function(e) {
        const old = e.target.result || {};

        const item = {
            key:                newKey,
            word,
            type,
            mean,
            sum_point_reading:  read,
            sum_point_speaking: old.sum_point_speaking || 0,
            next_reading_time:  next,
            next_speaking_time: old.next_speaking_time || next,
            created_date:       old.created_date  || today(),
            correct_count:      old.correct_count ?? 0,
            wrong_count:        old.wrong_count   ?? 0
        };

        const tx = db.transaction("words", "readwrite");
        const store = tx.objectStore("words");

        if (newKey !== oldKey) store.delete(oldKey);

        store.put(item);

        tx.oncomplete = () => {
            alert("Đã lưu!");
            takeVocabulary();
            debugShowAllWords();
        };
    };
}

function deleteWord(key) {
    if (!confirm("Bạn có chắc muốn xóa từ này?")) return;

    const tx = db.transaction("words", "readwrite");
    const store = tx.objectStore("words");

    store.delete(key);

    tx.oncomplete = function () {
        alert("Đã xóa!");
        takeVocabulary();      // reload danh sách học
        debugShowAllWords();   // reload bảng debug
    };

    tx.onerror = function () {
        alert("Không thể xóa từ!");
    };
}


function deleteAllWords() {
    // Không cần xác nhận — dùng nội bộ
    const tx = db.transaction("words", "readwrite");
    tx.objectStore("words").clear();
}
</script>
