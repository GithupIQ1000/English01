<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary</title>
  <style>
    /* ---- Theme variables ---- */
    :root {
      --bg:        #ffffff;
      --fg:        #111111;
      --border:    #333333;
      --muted:     #f3f3f3;
      --input-b:   #cccccc;
      --badge-bg:  #111;
      --badge-fg:  #fff;
    }
    body.dark {
      --bg:        #1a1a1a;
      --fg:        #eeeeee;
      --border:    #888888;
      --muted:     #2a2a2a;
      --input-b:   #555555;
      --badge-bg:  #eeeeee;
      --badge-fg:  #111111;
    }

    /* ---- Base ---- */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      font-size: 20px;
      padding: 14px;
      max-width: 600px;
      margin: 0 auto;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.2s, color 0.2s;
    }

    h3  { font-size: 22px; margin-bottom: 10px; }
    hr  { margin: 16px 0; border: 1px solid var(--border); }

    /* ---- Buttons ---- */
    button {
      padding: 14px 18px;
      font-size: 20px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      min-width: 80px;
      transition: background 0.15s;
      touch-action: manipulation;
    }
    button:active { opacity: 0.7; }

    /* ---- Word + Answer-btn ngang hàng ---- */
    #word-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #word-row #sentence {
      flex: 1;
      font-size: 36px;
      font-weight: bold;
    }
    #answer { text-align: center; }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-row button { flex: 1; min-width: 120px; }

    /* ---- Theme toggle — fixed top-right ---- */
    #themeBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 8px 14px;
      font-size: 22px;
      border-radius: 50px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      z-index: 999;
      min-width: unset;
    }

    /* ---- Settings button — fixed top-left ---- */
    #settingBtn {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 8px 14px;
      font-size: 22px;
      border-radius: 50px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      z-index: 999;
      min-width: unset;
      touch-action: manipulation;
    }

    /* ---- Settings panel overlay ---- */
    #settingsOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }
    #settingsOverlay.open { display: flex; }

    #settingsPanel {
      background: var(--bg);
      color: var(--fg);
      width: 100%;
      max-width: 600px;
      border-radius: 16px 16px 0 0;
      padding: 20px 18px 30px;
      border-top: 2px solid var(--border);
      max-height: 80vh;
      overflow-y: auto;
    }
    #settingsPanel h4 {
      font-size: 22px;
      margin-bottom: 18px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }
    .setting-row label {
      font-size: 19px;
      flex: 1;
    }
    .setting-row input[type="number"] {
      width: 90px;
      padding: 10px;
      font-size: 20px;
      border: 2px solid var(--input-b);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      text-align: center;
    }
    .setting-row input[type="text"],
    .setting-row input[type="password"] {
      flex: 1;
      padding: 10px;
      font-size: 18px;
      border: 2px solid var(--input-b);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
    }
    #settingsSaveBtn {
      width: 100%;
      margin-top: 8px;
    }
    .settings-section-title {
      font-size: 16px;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 18px 0 10px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    /* ---- Word count badge ---- */
    #wordCountBadge {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-fg);
      font-size: 20px;
      font-weight: bold;
      padding: 6px 18px;
      border-radius: 50px;
    }
    #wordCountBadge.hidden { display: none; }

    /* ---- Import ---- */
    input[type="file"] { font-size: 18px; width: 100%; margin-bottom: 10px; }
    #import-result { color: #2a9d2a; font-weight: bold; margin-top: 8px; font-size: 18px; }

    /* ---- Learn area ---- */
    #learn-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: stretch;
    }

    #word   { min-height: 50px; }
    #answer { font-size: 24px; min-height: 40px; }

    /* ---- Suggest button (inline, small, top-right of word-row) ---- */
    #suggestBtn {
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      min-width: unset;
      align-self: flex-start;
      opacity: 0.75;
      touch-action: manipulation;
    }
    #suggestBtn:active { opacity: 0.4; }

    /* ---- Suggest display (between word-row and answer) ---- */
    #suggest-area {
      font-size: 18px;
      font-style: italic;
      opacity: 0.85;
      min-height: 0;
      padding: 0 2px;
      line-height: 1.5;
    }
    #suggest-area.loading { opacity: 0.5; }

    /* ---- Debug table ---- */
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .search-row input {
      flex: 1 1 140px;
      padding: 10px;
      font-size: 18px;
      border: 2px solid var(--input-b);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      min-width: 0;
    }

    #table-wrap { overflow-x: auto; width: 100%; }

    table { width: 100%; border-collapse: collapse; font-size: 17px; }
    th, td { padding: 8px 10px; border: 1px solid var(--input-b); text-align: left; white-space: nowrap; }
    th { background: var(--muted); }
    td.col-mean { white-space: normal; min-width: 120px; }

    @media (orientation: landscape) {
      table { font-size: 18px; }
      .search-row input { font-size: 20px; }
    }

    #debug-output { margin-top: 10px; }

    /* ---- Edit form (2-row layout) ---- */
    #edit-box { padding: 12px; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
    #edit-box label { display: block; margin-bottom: 6px; font-size: 18px; }
    #edit-box input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      border: 2px solid var(--input-b);
      border-radius: 6px;
      margin-bottom: 10px;
      background: var(--bg);
      color: var(--fg);
    }

    /* inline edit rows in table */
    .edit-row-main td,
    .edit-row-extra td {
      background: var(--muted);
    }
    .edit-row-extra { overflow-x: auto; }
    .edit-row-extra td > div {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .edit-row-extra input {
      padding: 6px 8px;
      font-size: 16px;
      border: 2px solid var(--input-b);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
    }

    /* ---- Summary ---- */
    #finish {
      font-size: 22px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 12px;
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
  </style>
</head>
<body>

<!-- ===== THEME TOGGLE (fixed góc phải) ===== -->
<button id="themeBtn" onclick="toggleTheme()">☀️</button>

<!-- ===== SETTINGS BUTTON (fixed góc trái) ===== -->
<button id="settingBtn" onclick="openSettings()">⚙️</button>

<!-- ===== SETTINGS PANEL ===== -->
<div id="settingsOverlay" onclick="closeSettingsIfOutside(event)">
  <div id="settingsPanel">
    <h4>⚙️ Cài đặt</h4>

    <div class="settings-section-title">Thuật toán</div>

    <div class="setting-row">
      <label>Nx multiplier<br><small style="font-size:15px;opacity:0.6">nhân điểm khi bấm N_point</small></label>
      <input type="number" id="s_nx" step="0.1" min="1">
    </div>

    <div class="setting-row">
      <label>Bonus base<br><small style="font-size:15px;opacity:0.6">điểm cộng cố định khi đúng / trừ khi sai &lt;10</small></label>
      <input type="number" id="s_bonus_base" step="0.1" min="0">
    </div>

    <div class="setting-row">
      <label>Bonus divisor<br><small style="font-size:15px;opacity:0.6">chia điểm hiện tại để tính bonus (5.5)</small></label>
      <input type="number" id="s_bonus_div" step="0.1" min="0.1">
    </div>

    <div class="setting-row">
      <label>Nx threshold<br><small style="font-size:15px;opacity:0.6">ngưỡng điểm đổi công thức Nx (45)</small></label>
      <input type="number" id="s_nx_threshold" step="1" min="1">
    </div>

    <div class="settings-section-title">API — Gemini (tùy chọn)</div>
    <div class="setting-row">
      <label>Gemini API Key<br><small style="font-size:15px;opacity:0.6">lưu local, không upload git</small></label>
      <input type="password" id="s_gemini_key" placeholder="AIza...">
    </div>

    <button id="settingsSaveBtn" onclick="saveSettings()">💾 Lưu cài đặt</button>
  </div>
</div>

<!-- ===== IMPORT / EXPORT ===== -->
<h3>Upload JSON từ MySQL</h3>
<input type="file" id="jsonFile" accept=".json">

<div class="btn-row">
  <button onclick="importJSON()">Nhập dữ liệu</button>
  <button onclick="exportJSON()">Xuất JSON</button>
  <button id="btnToggleDebug" onclick="toggleDebug()">Show DS</button>
</div>

<div id="import-result"></div>

<hr>

<!-- ===== HỌC TỪ ===== -->
<div id="learn-area">

  <!-- Badge số từ hôm nay -->
  <div id="wordCountBadge" class="hidden"></div>

  <div id="word"></div>

  <!-- Suggest example sentence (between word and answer) -->
  <div id="suggest-area"></div>

  <div id="answer"></div>

  <div class="btn-row">
    <button class="learn" onclick="backWord()">Back</button>
    <button class="learn" onclick="nextWord()">Next</button>
  </div>

  <div class="btn-row">
    <button id="btnFinish" onclick="finish()">Finish</button>
    <button id="btnStart"  onclick="start()" style="display:none">Start</button>
  </div>
</div>

<div id="finish"></div>
<div id="debug-output"></div>


<script>
/* ============================================================
   THEME
============================================================ */
let isDark = false;

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle("dark", isDark);
  document.getElementById("themeBtn").textContent = isDark ? "🌙" : "☀️";
}


/* ============================================================
   SETTINGS
============================================================ */
const SETTINGS_KEY = "vocab_settings";

const DEFAULT_SETTINGS = {
  nx:           1.5,
  bonus_base:   1.5,
  bonus_div:    5.5,
  nx_threshold: 45,
  gemini_key:   ""
};

let cfg = { ...DEFAULT_SETTINGS };

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (saved) cfg = { ...DEFAULT_SETTINGS, ...saved };
  } catch { /* dùng default */ }
}

function openSettings() {
  loadSettings();
  document.getElementById("s_nx").value           = cfg.nx;
  document.getElementById("s_bonus_base").value   = cfg.bonus_base;
  document.getElementById("s_bonus_div").value    = cfg.bonus_div;
  document.getElementById("s_nx_threshold").value = cfg.nx_threshold;
  document.getElementById("s_gemini_key").value   = cfg.gemini_key || "";
  document.getElementById("settingsOverlay").classList.add("open");
}

function saveSettings() {
  cfg.nx           = Number(document.getElementById("s_nx").value)           || DEFAULT_SETTINGS.nx;
  cfg.bonus_base   = Number(document.getElementById("s_bonus_base").value)   || DEFAULT_SETTINGS.bonus_base;
  cfg.bonus_div    = Number(document.getElementById("s_bonus_div").value)    || DEFAULT_SETTINGS.bonus_div;
  cfg.nx_threshold = Number(document.getElementById("s_nx_threshold").value) || DEFAULT_SETTINGS.nx_threshold;
  cfg.gemini_key   = document.getElementById("s_gemini_key").value.trim();

  localStorage.setItem(SETTINGS_KEY, JSON.stringify(cfg));
  document.getElementById("settingsOverlay").classList.remove("open");
}

function closeSettingsIfOutside(e) {
  if (e.target === document.getElementById("settingsOverlay"))
    document.getElementById("settingsOverlay").classList.remove("open");
}


/* ============================================================
   INDEXEDDB OPEN
============================================================ */
let db;

const dbReq = indexedDB.open("MyDB", 1);

dbReq.onupgradeneeded = e => {
  const d = e.target.result;
  if (d.objectStoreNames.contains("words")) return;

  const store = d.createObjectStore("words", { keyPath: "key" });
  store.createIndex("word",              "word");
  store.createIndex("type",              "type");
  store.createIndex("mean",              "mean");
  store.createIndex("next_reading_time", "next_reading_time");
};

dbReq.onsuccess = e => {
  db = e.target.result;
  loadSettings();
  takeVocabulary();
};

dbReq.onerror = () => alert("Lỗi mở IndexedDB");


/* ============================================================
   HELPERS
============================================================ */
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const getStore = (mode) => db.transaction("words", mode).objectStore("words");

const setEl = (id, html) => document.getElementById(id).innerHTML = html;

const showLearnBtns = (show) =>
  document.querySelectorAll(".learn").forEach(b => b.style.display = show ? "inline-block" : "none");

function setWordCountBadge(n) {
  const badge = document.getElementById("wordCountBadge");
  if (n > 0) {
    badge.textContent = `📚 ${n} từ hôm nay`;
    badge.classList.remove("hidden");
  } else {
    badge.classList.add("hidden");
  }
}


/* ============================================================
   IMPORT JSON  — Task 1: fix race condition, thêm fields mới
   Hỗ trợ 2 cấu trúc JSON:
     Cấu trúc 1 (MySQL dump): [{type:"table", name:"words", data:[...]}, ...]
     Cấu trúc 2 (export app):  [{word, type, mean, sum_point_reading, ...}, ...]
============================================================ */
function importJSON() {
  const file = document.getElementById("jsonFile").files[0];
  if (!file) return alert("Chọn file trước!");

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);

      // --- Cấu trúc 1: MySQL dump ---
      let rawWords = null;
      if (Array.isArray(data)) {
        const tableObj = data.find(item => item.type === "table" && item.name === "words");
        if (tableObj && Array.isArray(tableObj.data)) {
          rawWords = tableObj.data;
        }
      }

      // --- Cấu trúc 2: export của app (mảng object có trường word/type/mean) ---
      if (!rawWords) {
        if (Array.isArray(data) && data.length > 0 && data[0].word && data[0].type && data[0].mean) {
          rawWords = data;
        }
      }

      if (!rawWords) return alert("Không tìm thấy bảng words!");

      saveWords(rawWords);
    } catch { alert("JSON lỗi!"); }
  };
  reader.readAsText(file);
}

/* ---- saveWords: có confirm xóa dữ liệu cũ + fix race condition ---- */
function saveWords(rawWords) {
  exportJSON(); // backup trước khi xóa

  // Lọc & xây map key→record
  // Cấu trúc 1 lọc theo host="Long", cấu trúc 2 không có host nên giữ tất cả
  const todayStr = today();
  const incoming = {};
  rawWords.forEach(w => {
    if (w.host && w.host !== "Long") return; // bỏ qua host khác nếu có
    const key = `${w.word}|${w.type}|${w.mean}`;
    incoming[key] = {
      key,
      word:              w.word,
      type:              w.type,
      mean:              w.mean,
      sum_point_reading: Number(w.sum_point_reading || 0),
      next_reading_time: w.next_reading_time || todayStr,
      created_date:      w.created_date      || todayStr,
      correct_count:     Number(w.correct_count  || 0),
      wrong_count:       Number(w.wrong_count    || 0)
    };
  });

  const keys = Object.keys(incoming);
  if (!keys.length) return alert("Không có từ nào hợp lệ trong file!");

  // Hỏi xác nhận trước khi xóa dữ liệu cũ
  if (!confirm(`Xóa toàn bộ dữ liệu cũ và nhập ${keys.length} từ mới?\n(Đã tự động backup trước khi xóa)`)) return;

  const clearTx = db.transaction("words", "readwrite");
  clearTx.objectStore("words").clear();
  clearTx.oncomplete = () => {
    // Xóa xong mới insert — transaction mới hoàn toàn
    insertAllWords(keys, incoming);
  };
  clearTx.onerror = e => {
    console.error("Clear error:", e.target.error);
    alert("Lỗi khi xóa dữ liệu cũ!");
  };
}

/* Chia nhỏ insert thành batch để tránh timeout transaction với dữ liệu lớn */
function insertAllWords(keys, incoming, batchSize = 200) {
  let offset = 0;
  let countInsert = 0;

  function insertBatch() {
    const batch = keys.slice(offset, offset + batchSize);
    if (!batch.length) {
      // Tất cả xong
      document.getElementById("import-result").innerText =
        `Nhập thành công ${countInsert} từ!`;
      takeVocabulary();
      if (debugVisible) debugShowAll();
      return;
    }

    const tx    = db.transaction("words", "readwrite");
    const store = tx.objectStore("words");

    batch.forEach(key => {
      store.put(incoming[key]);
      countInsert++;
    });

    tx.oncomplete = () => {
      offset += batchSize;
      insertBatch(); // đệ quy batch tiếp theo
    };
    tx.onerror = e => {
      console.error("Insert batch error:", e.target.error);
      alert(`Lỗi khi insert batch tại offset ${offset}!`);
    };
  }

  insertBatch();
}


/* ============================================================
   EXPORT JSON
============================================================ */
function exportJSON() {
  const tx = db.transaction("words", "readonly");
  tx.objectStore("words").getAll().onsuccess = e => {
    const all = e.target.result;
    if (!all?.length) return;   // không alert nếu trống (gọi tự động khi import)

    const data = all.map(w => ({
      word:              w.word,
      type:              w.type,
      mean:              w.mean,
      sum_point_reading: w.sum_point_reading,
      next_reading_time: w.next_reading_time,
      created_date:      w.created_date  || today(),
      correct_count:     w.correct_count || 0,
      wrong_count:       w.wrong_count   || 0
    }));

    const a    = document.createElement("a");
    a.href     = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    a.download = `words_${today()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
}


/* ============================================================
   LOAD DANH SÁCH HỌC HÔM NAY
============================================================ */
let words = [], count = -1, endCount = 0;

function takeVocabulary() {
  showLearnBtns(true);

  getStore("readonly").getAll().onsuccess = e => {
    const todayDate = today();
    words = e.target.result.filter(w => todayDate >= w.next_reading_time);
    words.sort((a, b) => a.sum_point_reading - b.sum_point_reading);

    words.forEach(w => { w.Nx_points = 0; w.status = -1; });

    endCount = words.length;
    count    = -1;

    setWordCountBadge(endCount);

    if (words.length === 0) {
      setEl("word", "Hôm nay không có bài.");
      showLearnBtns(false);
      return;
    }

    nextWord();
  };
}


/* ============================================================
   NEXT / BACK
============================================================ */
function nextWord() {
  count++;
  if (count >= endCount) {
    count = endCount;
    setEl("word",   "Hoàn thành!");
    setEl("answer", "");
    setEl("suggest-area", "");
    return;
  }
  showWord();
}

function backWord() {
  count = Math.max(0, count - 1);
  showWord();
}


/* ============================================================
   HIỂN THỊ TỪ  — Task 3: thêm nút Suggest
============================================================ */
let revealStep = 0;

function showWord() {
  revealStep = 0;
  setEl("suggest-area", ""); // reset suggest mỗi lần chuyển từ
  const w     = words[count];
  const color = w.status === 1 ? "green" : w.status === 0 ? "red" : "var(--fg)";

  // Nút Suggest chỉ hiện khi status === -1 (chưa trả lời)
  const suggestHtml = w.status === -1
    ? `<button id="suggestBtn" onclick="suggestExampleGemini()">💡 Suggest</button>`
    : "";

  setEl("word", `
    <div id="word-row">
      <div id="sentence" style="color:${color}">${w.word}</div>
      ${suggestHtml}
      <button onclick="revealAnswer()">Answer</button>
    </div>
  `);

  if (w.status === -1) {
    w.Nx_points = 0;
    setEl("answer", `<button onclick="markNx()">x N_point</button>`);
  } else {
    showFullCard();
  }
}


/* ============================================================
   REVEAL → FULL CARD (3 bước bấm)
============================================================ */
function revealAnswer() {
  const w   = words[count];
  const box = document.getElementById("answer");

  if (revealStep === 0) {
    box.innerHTML = `<div style="font-size:24px">(${w.type})</div>`;
    revealStep = 1;
    return;
  }
  if (revealStep === 1) {
    showFullCard();
    revealStep = 2;
    return;
  }

  // bước 3: ẩn lại
  box.innerHTML = w.status === -1 ? `<button onclick="markNx()">x N_point</button>` : "";
  revealStep = 0;
}


/* ============================================================
   SHOW FULL CARD
============================================================ */
function showFullCard() {
  const w = words[count];
  setEl("answer", `
    <div style="font-size:24px; margin-bottom:12px">
      <b>${w.word}</b> (${w.type}): ${w.mean}
    </div>
    <div class="btn-row">
      <button onclick="mark(0)">❌ Forget</button>
      <button onclick="mark(1)">✅ Ok</button>
    </div>
  `);
}


/* ============================================================
   MARK
============================================================ */
function markNx() {
  words[count].Nx_points = 1;
  setEl("answer", "");
}

function mark(status) {
  words[count].status = status;
  revealStep = 0;

  const s = document.querySelector("#word-row #sentence");
  if (s) s.style.color = status === 1 ? "green" : "red";

  // Ẩn nút Suggest khi đã trả lời
  const sb = document.getElementById("suggestBtn");
  if (sb) sb.remove();

  if (status === 1) nextWord();
}


/* ============================================================
   START / FINISH
============================================================ */
function start() {
  document.getElementById("btnStart").style.display  = "none";
  document.getElementById("btnFinish").style.display = "inline-block";
  setEl("finish", "");
  takeVocabulary();
}

function finish() {
  document.getElementById("btnStart").style.display  = "inline-block";
  document.getElementById("btnFinish").style.display = "none";
  saveVocabulary();
}


/* ============================================================
   LƯU KẾT QUẢ  — Task 2: cộng correct_count / wrong_count
============================================================ */
function saveVocabulary() {
  if (!words?.length) return alert("Không có dữ liệu để lưu.");

  const answered = words.filter(w => w.status === 0 || w.status === 1);
  if (!answered.length) return alert("Chưa trả lời từ nào.");

  const finishBox = document.getElementById("finish");
  finishBox.innerHTML = `<b>Hoàn thành hôm nay:</b><br><br>`;

  const tx    = db.transaction("words", "readwrite");
  const store = tx.objectStore("words");

  const Nx          = cfg.nx;
  const bonusBase   = cfg.bonus_base;
  const bonusDiv    = cfg.bonus_div;
  const nxThreshold = cfg.nx_threshold;
  const todayStr    = today();

  answered.forEach(w => {
    const pointBefore = Number(w.sum_point_reading);
    let   point       = pointBefore;
    let   newDate     = new Date(todayStr);

    // Task 2: cập nhật đếm đúng / sai
    const newCorrect = Number(w.correct_count || 0) + (w.status === 1 ? 1 : 0);
    const newWrong   = Number(w.wrong_count   || 0) + (w.status === 0 ? 1 : 0);

    if (w.status === 1) {
      const bonus = bonusBase + Math.round(point / bonusDiv * 100) / 100;
      point += bonus;

      if (w.Nx_points) {
        point = point < nxThreshold
          ? Math.round(point * Nx * 100) / 100
          : point + Math.round((point / 6) * Nx * 100) / 100;
      }

      newDate.setDate(newDate.getDate() + Math.floor(point));

    } else {
      // status = 0 (sai)
      if (point < 10) {
        point = Math.round(point * (2 / 3) * 100) / 100 - bonusBase;
        if (point < 0) point = 0;
      } else {
        point = Math.round(point * (3 / 4) * 100) / 100;
      }

      if (w.Nx_points) point = Math.round(point / Nx * 100) / 100;

      newDate.setDate(newDate.getDate() + Math.floor(point * 2 / 3));
    }

    const nextDate = newDate.toISOString().slice(0, 10);

    store.put({
      ...w,
      sum_point_reading: point,
      next_reading_time: nextDate,
      correct_count:     newCorrect,
      wrong_count:       newWrong,
      created_date:      w.created_date || todayStr
    });

    const color  = w.status === 1 ? "green" : "red";
    const arrow  = w.status === 1 ? "↑" : "↓";
    const nxMark = w.Nx_points ? " ✦" : "";

    finishBox.innerHTML += `
      <div style="color:${color}; margin-bottom:8px; font-size:20px">
        ${arrow} <b>${w.word}</b> (${w.type}): ${w.mean}${nxMark}
        <span style="font-size:16px; opacity:0.7; margin-left:6px">
          ${pointBefore.toFixed(2)} → ${point.toFixed(2)} · next: ${nextDate}
        </span>
      </div>
    `;
  });

  tx.oncomplete = () => {
    showLearnBtns(false);
    setWordCountBadge(0);
    setEl("word",   "");
    setEl("answer", "");
    setEl("suggest-area", "");
  };
}


/* ============================================================
   SUGGEST — Task 4: gọi Claude API
============================================================ */
async function suggestExample() {
  const w = words[count];
  if (!w) return;

  const suggestArea = document.getElementById("suggest-area");
  if (!suggestArea) return;

  // Ẩn nút để tránh bấm nhiều lần
  const btn = document.getElementById("suggestBtn");
  if (btn) btn.disabled = true;

  suggestArea.className = "loading";
  suggestArea.textContent = "⏳ Đang tạo câu ví dụ...";

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You are a vocabulary example generator.
STRICT RULES — follow exactly, no exceptions:
1. Reply with ONE English sentence only.
2. The sentence MUST contain the given word naturally.
3. Do NOT translate. Do NOT add explanation. Do NOT add punctuation outside the sentence.
4. Output only the sentence string, nothing else — no quotes, no labels, no newlines before or after.`,
        messages: [
          { role: "user", content: `word: "${w.word}" (${w.type})` }
        ]
      })
    });

    const data = await response.json();
    const sentence = data?.content?.[0]?.text?.trim() || "";

    suggestArea.className = "";
    if (sentence) {
      suggestArea.textContent = `💬 ${sentence}`;
    } else {
      suggestArea.textContent = "Không lấy được câu ví dụ.";
    }
  } catch (err) {
    suggestArea.className = "";
    suggestArea.textContent = "❌ Lỗi kết nối API.";
    console.error("Suggest error:", err);
  }
}

/* Hàm suggest dùng Gemini — cần API key trong Settings */
async function suggestExampleGemini() {
  const key = cfg.gemini_key;
  if (!key) return alert("Chưa nhập Gemini API key trong ⚙️ Cài đặt!");

  const w = words[count];
  if (!w) return;

  const suggestArea = document.getElementById("suggest-area");
  const btn = document.getElementById("suggestBtn");
  if (btn) btn.disabled = true;

  suggestArea.className = "loading";
  suggestArea.textContent = "⏳ Đang tạo câu ví dụ (Gemini)...";

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `You are a vocabulary example generator.
STRICT RULES:
1. Reply with ONE English sentence only.
2. The sentence MUST contain the word naturally.
3. Do NOT translate. Do NOT explain. Output only the sentence, nothing else.

word: "${w.word}" (${w.type})`
          }]
        }],
        generationConfig: { maxOutputTokens: 100, temperature: 0.7 }
      })
    });

    const data = await response.json();
    const sentence = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";

    suggestArea.className = "";
    suggestArea.textContent = sentence ? `💬 ${sentence}` : "Không lấy được câu ví dụ.";
  } catch (err) {
    suggestArea.className = "";
    suggestArea.textContent = "❌ Lỗi kết nối Gemini API.";
    console.error("Gemini suggest error:", err);
  }
}


/* ============================================================
   DEBUG — TOGGLE SHOW / HIDE
============================================================ */
let debugVisible = false;

function toggleDebug() {
  debugVisible = !debugVisible;
  document.getElementById("btnToggleDebug").textContent = debugVisible ? "Hide DS" : "Show DS";

  if (debugVisible) debugShowAll();
  else              setEl("debug-output", "");
}

/* Task 3: bảng thêm cột correct, wrong, created */
function debugShowAll() {
  getStore("readonly").getAll().onsuccess = e => {
    const list = e.target.result;

    let html = `
      <div class="btn-row">
        <button onclick="showCreateForm()">+ Tạo mới</button>
      </div>
      <div class="search-row">
        <input id="searchWord" placeholder="Tìm word" oninput="filterTable()">
        <input id="searchMean" placeholder="Tìm mean" oninput="filterTable()">
      </div>
      <div id="table-wrap">
        <table id="debug-table">
          <tr>
            <th>Word</th><th>Type</th><th>Mean</th><th>Point</th><th>Next</th><th>✅</th><th>❌</th><th>Created</th><th>Action</th>
          </tr>
    `;

    list.forEach(w => {
      const esc = s => String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      html += `
        <tr id="row-${esc(w.key)}" class="data-row" data-word="${esc(w.word)}" data-mean="${esc(w.mean)}">
          <td>${w.word}</td>
          <td>${w.type}</td>
          <td class="col-mean">${w.mean}</td>
          <td>${w.sum_point_reading}</td>
          <td>${w.next_reading_time}</td>
          <td>${w.correct_count || 0}</td>
          <td>${w.wrong_count   || 0}</td>
          <td>${w.created_date  || ''}</td>
          <td>
            <button onclick="editWord(${JSON.stringify(esc(w.key))})">Sửa</button>
            <button onclick="deleteWord(${JSON.stringify(esc(w.key))})">Xóa</button>
          </td>
        </tr>
      `;
    });

    html += "</table></div>";
    setEl("debug-output", html);
  };
}

function filterTable() {
  const word = document.getElementById("searchWord").value.toLowerCase();
  const mean = document.getElementById("searchMean").value.toLowerCase();

  document.querySelectorAll("#debug-table tr.data-row").forEach(tr => {
    const w = tr.dataset.word.toLowerCase();
    const m = tr.dataset.mean.toLowerCase();
    tr.style.display = (w.includes(word) && m.includes(mean)) ? "" : "none";
  });
}


/* ============================================================
   TẠO MỚI TỪ
============================================================ */
function showCreateForm() {
  document.getElementById("debug-output").insertAdjacentHTML("afterbegin", `
    <div id="edit-box">
      <b style="font-size:22px">Tạo mới từ</b>
      <label>Word: <input id="e_word" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"></label>
      <label>Type: <input id="e_type" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"></label>
      <label>Mean: <input id="e_mean" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"></label>
      <div class="btn-row">
        <button onclick="saveNewWord()">Lưu</button>
        <button onclick="debugShowAll()">Hủy</button>
      </div>
    </div>
  `);
}

function saveNewWord() {
  const word = document.getElementById("e_word").value.trim().toLowerCase();
  const type = document.getElementById("e_type").value.trim().toLowerCase();
  const mean = document.getElementById("e_mean").value.trim().toLowerCase();
  if (!word || !type || !mean) return alert("Thiếu dữ liệu!");

  const key      = `${word}|${type}|${mean}`;
  const todayStr = today();

  const tx = db.transaction("words", "readwrite");
  tx.objectStore("words").add({
    key, word, type, mean,
    sum_point_reading: 0,
    next_reading_time: todayStr,
    created_date:      todayStr,
    correct_count:     0,
    wrong_count:       0
  });

  tx.oncomplete = () => { alert("Đã tạo từ!"); takeVocabulary(); debugShowAll(); };
}


/* ============================================================
   SỬA TỪ  — Task 3: 2 dòng edit (word/type/mean + các field còn lại)
============================================================ */
function editWord(key) {
  // Giải mã key đã escape nếu cần
  const realKey = key;
  getStore("readonly").get(realKey).onsuccess = e => {
    const w   = e.target.result;
    if (!w) return alert("Không tìm thấy từ!");

    const tableRow = document.getElementById(`row-${realKey}`);
    if (!tableRow) return;

    // Dòng 1: word, type, mean
    tableRow.className = "edit-row-main";
    tableRow.innerHTML = `
      <td><input name="e_word_k" value="${w.word}" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" style="width:100%;font-size:18px;padding:6px"></td>
      <td><input name="e_type_k" value="${w.type}" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" style="width:60px;font-size:18px;padding:6px"></td>
      <td colspan="6"><input name="e_mean_k" value="${w.mean}" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" style="width:100%;font-size:18px;padding:6px"></td>
      <td>
        <button onclick="saveEdit('${realKey.replace(/'/g,"\\'")}')">Lưu</button>
        <button onclick="debugShowAll()">Hủy</button>
      </td>
    `;

    // Dòng 2: point, next, correct, wrong, created — scrollable
    const extraRow = document.createElement("tr");
    extraRow.className = "edit-row-extra";
    extraRow.innerHTML = `
      <td colspan="9">
        <div>
          <span style="font-size:15px;opacity:0.6;white-space:nowrap">Point:</span>
          <input name="e_read_k" value="${w.sum_point_reading}" style="width:70px">
          <span style="font-size:15px;opacity:0.6;white-space:nowrap">Next:</span>
          <input name="e_next_k" value="${w.next_reading_time}" style="width:120px">
          <span style="font-size:15px;opacity:0.6;white-space:nowrap">✅:</span>
          <input name="e_correct_k" value="${w.correct_count || 0}" style="width:60px">
          <span style="font-size:15px;opacity:0.6;white-space:nowrap">❌:</span>
          <input name="e_wrong_k"   value="${w.wrong_count   || 0}" style="width:60px">
          <span style="font-size:15px;opacity:0.6;white-space:nowrap">Created:</span>
          <input name="e_created_k" value="${w.created_date  || today()}" style="width:120px">
        </div>
      </td>
    `;
    tableRow.parentNode.insertBefore(extraRow, tableRow.nextSibling);
  };
}

function saveEdit(oldKey) {
  const q = name => document.querySelector(`input[name="${name}"]`).value.trim();

  const word    = q("e_word_k");
  const type    = q("e_type_k");
  const mean    = q("e_mean_k");
  const read    = Number(q("e_read_k"));
  const next    = q("e_next_k");
  const correct = Number(q("e_correct_k")) || 0;
  const wrong   = Number(q("e_wrong_k"))   || 0;
  const created = q("e_created_k");

  if (!word || !type || !mean) return alert("Thiếu dữ liệu!");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(next))    return alert("Next date phải theo định dạng YYYY-MM-DD");
  if (created && !/^\d{4}-\d{2}-\d{2}$/.test(created)) return alert("Created date phải theo định dạng YYYY-MM-DD");

  const newKey = `${word}|${type}|${mean}`;
  const item   = {
    key: newKey, word, type, mean,
    sum_point_reading: read,
    next_reading_time: next,
    correct_count:     correct,
    wrong_count:       wrong,
    created_date:      created || today()
  };

  const tx    = db.transaction("words", "readwrite");
  const store = tx.objectStore("words");

  if (newKey !== oldKey) store.delete(oldKey);
  store.put(item);

  tx.oncomplete = () => { alert("Đã lưu!"); takeVocabulary(); debugShowAll(); };
}


/* ============================================================
   XÓA TỪ / XÓA TẤT CẢ
============================================================ */
function deleteWord(key) {
  if (!confirm("Xóa từ này?")) return;

  const tx = db.transaction("words", "readwrite");
  tx.objectStore("words").delete(key);

  tx.oncomplete = () => { alert("Đã xóa!"); takeVocabulary(); debugShowAll(); };
  tx.onerror    = () => alert("Không thể xóa!");
}

function deleteAllWords() {
  // Không cần confirm — chỉ gọi nội bộ sau khi đã backup
  const tx = db.transaction("words", "readwrite");
  tx.objectStore("words").clear();
  tx.oncomplete = () => {
    takeVocabulary();
    if (debugVisible) debugShowAll();
  };
}
